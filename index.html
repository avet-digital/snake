<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змейка</title>
<style>
  /* Цвета игры — меняй здесь, чтобы перекрасить всё сразу */
  :root {
    --bg: #0f172a;
    --board: #1e293b;
    --cell: #223049;
    --snake: #22c55e;
    --head: #86efac;
    --food: #f43f5e;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { margin: 0; font-size: 28px; }
  .hud { display: flex; gap: 24px; font-size: 18px; }
  .hud b { color: var(--head); }
  .board { position: relative; width: min(90vw, 480px); aspect-ratio: 1; }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    background: var(--board);
    touch-action: none; /* чтобы свайпы на телефоне не прокручивали страницу */
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.8);
    text-align: center;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 26px; }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 10px 28px;
    border: 0;
    border-radius: 8px;
    background: var(--snake);
    color: #052e16;
    cursor: pointer;
  }
  .help { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.6; }

  /* Подвал с разработчиком */
  .dev {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 480px;
    margin-top: 8px;
    padding-top: 16px;
    border-top: 1px solid #334155;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
  }
  .dev img { display: block; height: 48px; width: auto; }
  .dev a { color: var(--text); }
  .dev-contacts { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; }
</style>
</head>
<body>
  <h1>🐍 Змейка</h1>

  <div class="hud">
    <div>Счёт: <b id="score">0</b></div>
    <div>Рекорд: <b id="best">0</b></div>
  </div>

  <div class="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Готов?</h2>
      <p id="overlay-text">Собирай яблоки и не врезайся в стены и в себя</p>
      <button id="start-btn">Играть</button>
    </div>
  </div>

  <div class="help">
    Стрелки или WASD — поворот · Пробел — пауза · Enter — старт<br>
    На телефоне — свайпы по полю
  </div>

  <footer class="dev">
    <a href="https://www.avetdigital.ru" target="_blank" rel="noopener"><img src="logo.svg" alt="Avet Digital"></a>
    <div>Разработчик: <a href="https://www.avetdigital.ru" target="_blank" rel="noopener">Avet Digital</a></div>
    <div class="dev-contacts">
      <a href="tel:+79777700099">+7 (977) 770-00-99</a>
      <a href="mailto:info@avetdigital.ru">info@avetdigital.ru</a>
      <a href="https://t.me/avetdigital" target="_blank" rel="noopener">Telegram</a>
      <a href="https://wa.me/79777700099" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </footer>

<script>
// ===== Настройки =====
const GRID = 20;          // сколько клеток по каждой стороне поля
const START_SPEED = 150;  // пауза между шагами в миллисекундах (меньше — быстрее)
const MIN_SPEED = 60;     // самая высокая скорость
const SPEED_STEP = 15;    // насколько ускоряемся каждые 5 яблок

// ===== Элементы страницы =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const CELL = canvas.width / GRID; // размер одной клетки в пикселях

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');
const startBtn = document.getElementById('start-btn');

// ===== Состояние игры =====
let snake;     // массив клеток {x, y}; snake[0] — голова
let dir;       // текущее направление движения, например {x: 1, y: 0} — вправо
let dirQueue;  // очередь поворотов, нажатых между шагами
let food;      // клетка с яблоком
let score;
let speed;
let timer;     // id таймера, который двигает змейку
let state = 'ready'; // 'ready' | 'running' | 'paused' | 'over'

// Рекорд храним в браузере, чтобы он не пропадал после перезагрузки
function loadBest() {
  try { return Number(localStorage.getItem('snake-best')) || 0; } catch { return 0; }
}
function saveBest(value) {
  try { localStorage.setItem('snake-best', value); } catch {}
}
let best = loadBest();

// ===== Логика =====
function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  dirQueue = [];
  score = 0;
  speed = START_SPEED;
  placeFood();
  updateHud();
  draw();
}

// Кладём яблоко в случайную свободную клетку
function placeFood() {
  const free = [];
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    }
  }
  food = free[Math.floor(Math.random() * free.length)]; // undefined, если места нет
}

// Один шаг змейки — вызывается таймером
function step() {
  if (dirQueue.length) dir = dirQueue.shift();

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const eating = head.x === food.x && head.y === food.y;

  // Если не едим, хвост на этом шаге уйдёт — в него врезаться нельзя
  const body = eating ? snake : snake.slice(0, -1);
  const hitWall = head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID;
  const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver(false);

  snake.unshift(head); // новая голова спереди

  if (eating) {
    score++;
    if (score % 5 === 0) {
      speed = Math.max(MIN_SPEED, speed - SPEED_STEP);
      restartTimer();
    }
    placeFood();
    updateHud();
    if (!food) return gameOver(true); // всё поле занято — победа!
  } else {
    snake.pop(); // убираем хвост — змейка «переехала» на клетку
  }

  draw();
}

// Поворот: не даём развернуться назад, в собственную шею
function turn(x, y) {
  if (state === 'over' || state === 'paused') return;
  if (state === 'ready') start(); // любая стрелка запускает игру
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (last.x === -x && last.y === -y) return;
  if (last.x === x && last.y === y) return;
  if (dirQueue.length < 3) dirQueue.push({ x, y });
}

function restartTimer() {
  clearInterval(timer);
  timer = setInterval(step, speed);
}

function start() {
  if (state === 'over') reset();
  state = 'running';
  overlay.hidden = true;
  restartTimer();
}

function togglePause() {
  if (state === 'running') {
    state = 'paused';
    clearInterval(timer);
    showOverlay('Пауза', 'Нажми пробел, чтобы продолжить', 'Продолжить');
  } else if (state === 'paused') {
    start();
  }
}

function gameOver(won) {
  clearInterval(timer);
  state = 'over';
  const newRecord = score > best;
  if (newRecord) {
    best = score;
    saveBest(best);
    updateHud();
  }
  const title = won ? 'Победа! 🏆' : 'Игра окончена';
  const text = `Счёт: ${score}` + (newRecord ? ' — новый рекорд! 🎉' : '');
  showOverlay(title, text, 'Ещё раз');
}

// ===== Отображение =====
function showOverlay(title, text, buttonText) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  startBtn.textContent = buttonText;
  overlay.hidden = false;
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
}

function drawCell(x, y, color, inset = 2, radius = 6) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2, radius);
  ctx.fill();
}

function draw() {
  const css = getComputedStyle(document.documentElement);
  const color = name => css.getPropertyValue(name).trim();

  // Поле в шахматную клетку
  ctx.fillStyle = color('--board');
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      if ((x + y) % 2) drawCell(x, y, color('--cell'), 0, 0);
    }
  }

  // Яблоко
  if (food) {
    ctx.fillStyle = color('--food');
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Змейка: сначала тело, потом голова поверх
  snake.slice(1).forEach(s => drawCell(s.x, s.y, color('--snake')));
  drawCell(snake[0].x, snake[0].y, color('--head'), 1, 8);
}

// ===== Управление =====
const KEYS = {
  ArrowUp: [0, -1], KeyW: [0, -1],
  ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0],
  ArrowRight: [1, 0], KeyD: [1, 0],
};

document.addEventListener('keydown', e => {
  if (KEYS[e.code]) {
    e.preventDefault();
    turn(...KEYS[e.code]);
  } else if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  } else if (e.code === 'Enter' && (state === 'ready' || state === 'over')) {
    start();
  }
});

startBtn.addEventListener('click', start);

// Свайпы на телефоне
let touchStart = null;
canvas.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
canvas.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return; // слишком короткий свайп
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
  else turn(0, Math.sign(dy));
});

// ===== Запуск =====
reset();
</script>
</body>
</html>
